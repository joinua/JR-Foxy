version: "3.9"

services:
  jr-foxy:
    image: jr-foxy:${BOT_VERSION:-dev}
    build: .
    container_name: jr-foxy
    restart: always
    env_file:
      - .env
    environment:
      BOT_VERSION: ${BOT_VERSION:-dev}
    labels:
      com.jokerrecon.jr-foxy.version: ${BOT_VERSION:-dev}
    volumes:
      - ./data:/app/data
